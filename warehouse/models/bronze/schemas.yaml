version: 2
models:
- name: bronze_events
  columns:
  - name: id
    data_type: int
    tests:
    - unique
    - not_null
  - name: event
    data_type: string
    tests:
    - unique
    - not_null

- name: bronze_stats
  tests:
  - has_expected_columns:
      arguments:
        column_names:
        - filename
        - ingest_datetime
  columns:
  - name: fixture_id
    data_type: int
    tests:
    - not_null
    - dbt_utils.accepted_range:
        arguments:
          min_value: 1
    # - dbt_expectations.expect_column_values_to_be_of_type:
    #     column_type: int
  - name: event_id
    data_type: string
    tests:
    - not_null
    # - dbt_utils.accepted_range:
    #     arguments:
    #       min_value: 1
    # - dbt_expectations.expect_column_values_to_be_of_type:
    #     column_type: int
  - name: team_id
    data_type: int
    tests:
    - not_null
    - dbt_utils.accepted_range:
        arguments:
          min_value: 1
    # - dbt_expectations.expect_column_values_to_be_of_type:
    #     column_type: int
  - name: player_id
    data_type: int
    tests:
    - not_null
    - dbt_utils.accepted_range:
        arguments:
          min_value: 1
    # - dbt_expectations.expect_column_values_to_be_of_type:
    #     column_type: int
  - name: value
    data_type: int
    tests:
    - not_null
    # - dbt_expectations.expect_column_values_to_be_of_type:
    #     column_type: int
- name: bronze_fixtures
  tests:
  - has_expected_columns:
      arguments:
        column_names:
        - filename
        - ingest_datetime
